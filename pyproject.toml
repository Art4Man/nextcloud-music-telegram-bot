[project]
name = "nc-music-bot"
version = "0.1.0"
description = "Portable Telegram → Nextcloud music relay: receive audio on Telegram, push it over Tailscale (SFTP) into a Nextcloud library, and trigger occ scans so tracks appear in Subsonic clients immediately."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Amir Nasiri" }]
dependencies = [
    "python-telegram-bot>=21.6",
    "asyncssh>=2.17",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nc_music_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# python-telegram-bot's Application carries six type parameters; spelling them
# out adds noise without safety. Everything else in the module stays strict.
module = "nc_music_bot.bot"
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
